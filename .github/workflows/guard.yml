name: Проверка источника кода

# backend/ и frontend/ здесь — копия, которая обновляется автоматически
# из Modus-trade/modus-back и Modus-trade/modus-front. Правки вносятся там.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**"]
  pull_request:
    paths: ["backend/**", "frontend/**"]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Изменения пришли из синхронизации?
        env:
          AUTHOR: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "modus-sync[bot]" ]; then echo "Синхронизация — всё в порядке"; exit 0; fi
          echo "::error::Папки backend/ и frontend/ нельзя менять в этом репозитории — их перезапишет синхронизация."
          echo "::error::Коммитьте в Modus-trade/modus-back (бэкенд) или Modus-trade/modus-front (фронтенд)."
          exit 1
